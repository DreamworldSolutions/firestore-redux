name: Release

on:
  push:
    branches:
      - main
      - 'feature/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push release tags and create GitHub releases
  issues: write # comment on issues resolved by a release
  pull-requests: write # comment on pull requests included in a release

jobs:
  release-snapshot:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history and tags
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.SNAPSHOT_NPM_TOKEN }}
          NPM_PACKAGE_SCOPE: ${{ secrets.NPM_PACKAGE_SCOPE }}
          NPM_SNAPSHOT_REPO: ${{ secrets.NPM_SNAPSHOT_REPO }}
        run: |
          npm config set "${NPM_PACKAGE_SCOPE}:registry" "${NPM_SNAPSHOT_REPO}"
          npx semantic-release

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history and tags
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - run: echo "Running release job"
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
